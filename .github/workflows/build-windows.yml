name: Build and test Windows x64

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Run interaction diagnostics without compiling or packaging
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: liveviewer-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      QT_MEDIA_BACKEND: ffmpeg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-build.txt
      - name: Fetch and validate pinned LGPL frame tools
        run: python scripts/fetch_frame_tools.py
      - name: Preflight Windows filmstrip touch interactions
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force 'reports' | Out-Null
          $process = Start-Process -FilePath (Get-Command python).Source -WorkingDirectory $PWD.Path -ArgumentList '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_touch_filmstrip.py', '-v' -PassThru -RedirectStandardOutput 'reports/preflight-touch-filmstrip.stdout.log' -RedirectStandardError 'reports/preflight-touch-filmstrip.stderr.log'
          $finished = $process.WaitForExit(150000)
          if (-not $finished) { Stop-Process -Id $process.Id -Force }
          $testExitCode = if ($finished) { $process.ExitCode } else { -1 }
          Get-Content 'reports/preflight-touch-filmstrip.stdout.log', 'reports/preflight-touch-filmstrip.stderr.log' | Tee-Object -FilePath 'reports/preflight-touch-filmstrip.log'
          if (-not $finished) { throw 'Filmstrip interaction preflight timed out' }
          if ($testExitCode -ne 0) { throw "Filmstrip interaction preflight failed with exit code $testExitCode" }
      - name: Preflight viewer long-touch context menu ownership
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath (Get-Command python).Source -WorkingDirectory $PWD.Path -ArgumentList '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_viewer.py', '-v' -PassThru -RedirectStandardOutput 'reports/preflight-viewer.stdout.log' -RedirectStandardError 'reports/preflight-viewer.stderr.log'
          $finished = $process.WaitForExit(150000)
          if (-not $finished) { Stop-Process -Id $process.Id -Force }
          $testExitCode = if ($finished) { $process.ExitCode } else { -1 }
          Get-Content 'reports/preflight-viewer.stdout.log', 'reports/preflight-viewer.stderr.log' | Tee-Object -FilePath 'reports/preflight-viewer.log'
          if (-not $finished) { throw 'Viewer touch menu preflight timed out' }
          if ($testExitCode -ne 0) { throw "Viewer touch menu preflight failed with exit code $testExitCode" }
      - name: Preflight Windows cover editor lifecycle and interactions
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          if (-not (Test-Path 'tests/fixtures/VFR_PAIR.MOV')) { throw 'Committed VFR preflight fixture is absent' }
          New-Item -ItemType Directory -Force 'reports' | Out-Null
          $process = Start-Process -FilePath (Get-Command python).Source -WorkingDirectory $PWD.Path -ArgumentList '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_cover_editor.py', '-v' -PassThru -RedirectStandardOutput 'reports/preflight-cover-editor.stdout.log' -RedirectStandardError 'reports/preflight-cover-editor.stderr.log'
          $finished = $process.WaitForExit(150000)
          if (-not $finished) { Stop-Process -Id $process.Id -Force }
          $testExitCode = if ($finished) { $process.ExitCode } else { -1 }
          Get-Content 'reports/preflight-cover-editor.stdout.log', 'reports/preflight-cover-editor.stderr.log' | Tee-Object -FilePath 'reports/preflight-cover-editor.log'
          if (-not $finished) { throw 'Cover editor interaction preflight timed out' }
          if ($testExitCode -ne 0) { throw "Cover editor interaction preflight failed with exit code $testExitCode" }
      - name: Preflight native Windows settings touch routing
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          New-Item -ItemType Directory -Force 'reports' | Out-Null
          $process = Start-Process -FilePath (Get-Command python).Source -WorkingDirectory $PWD.Path -ArgumentList '-m', 'tests.settings_native_probe', '--expect-platform', 'windows', '--report', 'reports/native-settings-probe.json' -PassThru -RedirectStandardOutput 'reports/preflight-native-settings.stdout.log' -RedirectStandardError 'reports/preflight-native-settings.stderr.log'
          $finished = $process.WaitForExit(150000)
          if (-not $finished) { Stop-Process -Id $process.Id -Force }
          $testExitCode = if ($finished) { $process.ExitCode } else { -1 }
          Get-Content 'reports/preflight-native-settings.stdout.log', 'reports/preflight-native-settings.stderr.log' | Tee-Object -FilePath 'reports/preflight-native-settings.log'
          if (-not $finished) { throw 'Native settings interaction preflight timed out' }
          if ($testExitCode -ne 0) { throw "Native settings interaction preflight failed with exit code $testExitCode" }
          $report = Get-Content -Raw 'reports/native-settings-probe.json' | ConvertFrom-Json
          if ($report.status -cne 'passed') { throw "Native settings probe status: $($report.status)" }
      - name: Preflight native settings after viewer and Explorer interactions
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $process = Start-Process -FilePath (Get-Command python).Source -WorkingDirectory $PWD.Path -ArgumentList '-m', 'tests.settings_native_probe', '--source-context', '--expect-platform', 'windows', '--report', 'reports/native-settings-source-context.json' -PassThru -RedirectStandardOutput 'reports/preflight-settings-source-context.stdout.log' -RedirectStandardError 'reports/preflight-settings-source-context.stderr.log'
          $finished = $process.WaitForExit(150000)
          if (-not $finished) { Stop-Process -Id $process.Id -Force }
          $testExitCode = if ($finished) { $process.ExitCode } else { -1 }
          Get-Content 'reports/preflight-settings-source-context.stdout.log', 'reports/preflight-settings-source-context.stderr.log' | Tee-Object -FilePath 'reports/preflight-settings-source-context.log'
          if (-not $finished) { throw 'Settings source-context preflight timed out' }
          if ($testExitCode -ne 0) { throw "Settings source-context preflight failed with exit code $testExitCode" }
          $report = Get-Content -Raw 'reports/native-settings-source-context.json' | ConvertFrom-Json
          if ($report.status -cne 'passed') { throw "Settings source-context status: $($report.status)" }
      - name: Preflight actual Windows native SaveAs export
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $process = Start-Process -FilePath (Get-Command python).Source -WorkingDirectory $PWD.Path -ArgumentList '-m', 'tests.windows_export_probe', '--readonly-directory', '--report', 'reports/native-export.json' -PassThru -RedirectStandardOutput 'reports/preflight-native-export.stdout.log' -RedirectStandardError 'reports/preflight-native-export.stderr.log'
          $finished = $process.WaitForExit(150000)
          if (-not $finished) { Stop-Process -Id $process.Id -Force }
          $testExitCode = if ($finished) { $process.ExitCode } else { -1 }
          Get-Content 'reports/preflight-native-export.stdout.log', 'reports/preflight-native-export.stderr.log' | Tee-Object -FilePath 'reports/preflight-native-export.log'
          if (-not $finished) { throw 'Native SaveAs export preflight timed out' }
          if ($testExitCode -ne 0) { throw "Native SaveAs export preflight failed with exit code $testExitCode" }
          $report = Get-Content -Raw 'reports/native-export.json' | ConvertFrom-Json
          if ($report.status -cne 'passed') { throw "Native export status: $($report.status)" }
      - name: Identify native build environment
        if: ${{ !inputs.preflight_only }}
        id: heic_environment
        shell: pwsh
        env:
          HEIC_INPUT_HASH: ${{ hashFiles('scripts/build_heic_encoder.py', 'dependencies/heic-encoder.json', 'native/heic_encoder/**', 'requirements-build.txt', 'requirements.txt') }}
          HEIC_RUNNER_OS: ${{ runner.os }}
          HEIC_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'Hosted runner image identity is unavailable' }
          $image = '{0}-{1}' -f $env:ImageOS, $env:ImageVersion
          $key = 'heic-v1-{0}-{1}-{2}-{3}' -f $env:HEIC_RUNNER_OS, $env:HEIC_RUNNER_ARCH, $image, $env:HEIC_INPUT_HASH
          "cache_key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore matching native HEIC output
        if: ${{ !inputs.preflight_only }}
        id: heic_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/heic
            licenses/HEIC
          key: ${{ steps.heic_environment.outputs.cache_key }}
      - name: Build private HEIC encoder from pinned sources
        if: ${{ !inputs.preflight_only && (steps.heic_cache.outcome != 'success' || steps.heic_cache.outputs.cache-hit != 'true') }}
        run: python scripts/build_heic_encoder.py
      - name: Verify native HEIC sources and binary provenance
        if: ${{ !inputs.preflight_only }}
        run: python scripts/build_heic_encoder.py --verify-only
      - name: Save verified native HEIC output immediately
        if: ${{ !inputs.preflight_only && (steps.heic_cache.outcome != 'success' || steps.heic_cache.outputs.cache-hit != 'true') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/heic
            licenses/HEIC
          key: ${{ steps.heic_environment.outputs.cache_key }}
      - name: Prepare and verify media fixtures
        if: ${{ !inputs.preflight_only }}
        run: python scripts/generate_fixtures.py --output tests/fixtures --require-codecs
      - name: Test indexing, images, gestures, and playback state
        if: ${{ !inputs.preflight_only }}
        run: python -m unittest discover -s tests -v
      - name: Test source application and media decoding
        if: ${{ !inputs.preflight_only }}
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          python launch.py --self-test --fixtures tests/fixtures --report-dir reports/source
          if ($LASTEXITCODE -ne 0) { throw "Source application test failed with exit code $LASTEXITCODE" }
          $report = Get-Content -Raw 'reports/source/self-test.json' | ConvertFrom-Json
          if ($report.status -cne 'passed') { throw "Source test report status: $($report.status)" }
      - name: Build portable Windows application
        if: ${{ !inputs.preflight_only }}
        run: python scripts/build_windows.py --build-only
      - name: Verify executable architecture and bundled decoders
        if: ${{ !inputs.preflight_only }}
        run: python scripts/verify_bundle.py
      - name: Test frozen application and media decoding
        if: ${{ !inputs.preflight_only }}
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $process = Start-Process -FilePath '.\dist\LiveViewer\LiveViewer.exe' -ArgumentList '--self-test', '--fixtures', 'tests/fixtures', '--report-dir', 'reports/frozen' -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw "Frozen media test timed out" }
          if ($process.ExitCode -ne 0) { throw "Frozen application test failed with exit code $($process.ExitCode)" }
          $report = Get-Content -Raw 'reports/frozen/self-test.json' | ConvertFrom-Json
          if ($report.status -cne 'passed') { throw "Frozen test report status: $($report.status)" }
      - name: Verify normal Windows desktop startup
        if: ${{ !inputs.preflight_only }}
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\LiveViewer\LiveViewer.exe' -ArgumentList '--folder', 'tests/fixtures', '--screenshot', 'reports/frozen/windows-desktop.png' -PassThru
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id -Force; throw "Desktop startup timed out" }
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed" }
          if (-not (Test-Path 'reports/frozen/windows-desktop.png')) { throw "Desktop preview was not produced" }
      - name: Verify tests left no runtime data in the bundle
        if: ${{ !inputs.preflight_only }}
        run: python scripts/verify_bundle.py
      - name: Create portable and source archives with checksums
        if: ${{ !inputs.preflight_only }}
        run: python scripts/build_windows.py --archive-only
      - name: Upload portable application and corresponding source
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LiveViewer-Windows-x64-v0.7.2
          path: release/
          if-no-files-found: error
          retention-days: 3
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LiveViewer-Windows-x64-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 3
